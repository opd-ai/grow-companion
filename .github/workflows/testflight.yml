name: TestFlight delivery

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version for a manual upload (for example 1.2.3); blank uses the project version
        required: false
        type: string

permissions:
  contents: read

jobs:
  archive-and-upload:
    name: Sign, archive, and upload
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.4.1

      - name: Resolve package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -clonedSourcePackagesDirPath "$HOME/.cache/org.swift.swiftpm"
          -project "Grow Companion.xcodeproj"
          -scheme "Grow Companion"

      - name: Sign, archive, export, and upload to TestFlight
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
          IOS_APP_GROUP_ID: ${{ vars.IOS_APP_GROUP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          : "${IOS_BUNDLE_ID:?Add the IOS_BUNDLE_ID repository variable}"
          : "${IOS_WIDGET_BUNDLE_ID:?Add the IOS_WIDGET_BUNDLE_ID repository variable}"
          : "${IOS_APP_GROUP_ID:?Add the IOS_APP_GROUP_ID repository variable}"
          : "${APPLE_TEAM_ID:?Add the APPLE_TEAM_ID repository secret}"
          : "${APP_STORE_CONNECT_API_KEY_ID:?Add the APP_STORE_CONNECT_API_KEY_ID repository secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Add the APP_STORE_CONNECT_ISSUER_ID repository secret}"
          : "${APP_STORE_CONNECT_API_PRIVATE_KEY:?Add the APP_STORE_CONNECT_API_PRIVATE_KEY repository secret}"

          if [[ "$IOS_BUNDLE_ID:$IOS_WIDGET_BUNDLE_ID:$IOS_APP_GROUP_ID" == *organizationName* ]]; then
            echo "::error::Placeholder identifiers remain. Register and configure the app, widget, and App Group identifiers first."
            exit 1
          fi
          case "$IOS_WIDGET_BUNDLE_ID" in
            "$IOS_BUNDLE_ID".?*) ;;
            *) echo "::error::IOS_WIDGET_BUNDLE_ID must be distinct and start with IOS_BUNDLE_ID followed by a dot and a suffix."; exit 1 ;;
          esac

          APP_PROJECT_BUNDLE_ID="$(xcodebuild -showBuildSettings -project "Grow Companion.xcodeproj" -target "Grow Companion" -configuration Release | awk -F ' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / && !value { value = $2 } END { print value }')"
          WIDGET_PROJECT_BUNDLE_ID="$(xcodebuild -showBuildSettings -project "Grow Companion.xcodeproj" -target "Grow CompanionWidgetExtension" -configuration Release | awk -F ' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / && !value { value = $2 } END { print value }')"
          APP_GROUP_IN_APP="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "Grow Companion/Grow Companion.entitlements")"
          APP_GROUP_IN_WIDGET="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "Grow CompanionWidgetExtension/Grow CompanionWidgetExtension.entitlements")"

          if [[ "$APP_PROJECT_BUNDLE_ID" != "$IOS_BUNDLE_ID" ]]; then
            echo "::error::IOS_BUNDLE_ID does not match the app target's configured PRODUCT_BUNDLE_IDENTIFIER ($APP_PROJECT_BUNDLE_ID)."
            exit 1
          fi
          if [[ "$WIDGET_PROJECT_BUNDLE_ID" != "$IOS_WIDGET_BUNDLE_ID" ]]; then
            echo "::error::IOS_WIDGET_BUNDLE_ID does not match the widget target's configured PRODUCT_BUNDLE_IDENTIFIER ($WIDGET_PROJECT_BUNDLE_ID)."
            exit 1
          fi
          if [[ "$APP_GROUP_IN_APP" != "$IOS_APP_GROUP_ID" || "$APP_GROUP_IN_WIDGET" != "$IOS_APP_GROUP_ID" ]]; then
            echo "::error::IOS_APP_GROUP_ID must match the App Group entitlement in both targets."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/grow-companion-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          API_KEY_PATH="$SIGNING_DIR/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          ARCHIVE_PATH="$SIGNING_DIR/Grow Companion.xcarchive"
          EXPORT_PATH="$SIGNING_DIR/export"
          EXPORT_OPTIONS_PATH="$SIGNING_DIR/ExportOptions.plist"

          cleanup() {
            rm -rf "$SIGNING_DIR"
          }
          trap cleanup EXIT

          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          if [[ "$EVENT_REF_TYPE" == "tag" ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$RELEASE_VERSION"
            if [[ -z "$APP_VERSION" ]]; then
              APP_VERSION="$(xcodebuild -showBuildSettings -project "Grow Companion.xcodeproj" -scheme "Grow Companion" -configuration Release | awk -F ' = ' '/MARKETING_VERSION = / && !value { value = $2 } END { print value }')"
            fi
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must be numeric, such as 1.2.3. Got '$APP_VERSION'."
            exit 1
          fi

          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project "Grow Companion.xcodeproj" \
            -scheme "Grow Companion" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_REQUIRED=YES

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::Xcode did not export an IPA."
            exit 1
          fi

          API_PRIVATE_KEYS_DIR="$SIGNING_DIR/private_keys" xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing key (always)
        if: always()
        run: |
          SIGNING_DIR="$RUNNER_TEMP/grow-companion-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SIGNING_DIR"
